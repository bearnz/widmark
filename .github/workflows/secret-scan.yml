# Secret scanning with gitleaks over the full git history, on every push and
# PR. The job itself lives in bearnz/ci-templates and follows its v1 tag, so
# gitleaks is bumped there, not here. Add to a repo with the /secret-scan skill.
#
# Accepting a finding: if it's a false positive, or a secret that's already
# been rotated, add its Fingerprint (printed in the log) to .gitleaksignore at
# the repo root. Never accept a live secret. Rotate it first.
name: secret-scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    uses: bearnz/ci-templates/.github/workflows/secret-scan.yml@v1
